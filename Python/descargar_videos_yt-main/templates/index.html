<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Descargar YouTube</title>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <form method="POST" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-xl font-bold mb-4 text-center">Pega el enlace del video</h2>
    <input type="url" name="url" required placeholder="https://www.youtube.com/..." class="w-full px-4 py-2 border rounded mb-4">
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Continuar</button>
  </form>
</body>
</html>
