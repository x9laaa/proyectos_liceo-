<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Listo para descargar</title>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-xl shadow-xl text-center">
    <h2 class="text-2xl font-bold text-green-700 mb-4">Video procesado con éxito</h2>
    <form method="POST">
      <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition">
        Descargar ahora
      </button>
    </form>
    <a href="{{ url_for('index') }}" class="block mt-4 text-blue-600 hover:underline">Descargar otro video</a>
  </div>
</body>
</html>
