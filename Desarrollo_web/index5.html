<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

        }

        form {
            background-color: white;
            width: 400px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);


        }


        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;

        }

        input[type="submit"] {
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
            width: 150px;
            display: block;
            margin: auto;
            margin-top: 15px;
            
            
            

        }

        input[type="submit"]:hover {
            background-color: darkblue;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
        }

        * {
            box-sizing: border-box;
        }

        input[type="submit"] {}
    </style>
</head>

<body>
    <form>
        <h2>Registro</h2>

        <label>Nombre:</label>
        <input type="text">

        <label>Correo:</label>
        <input type="email">

        <label>Contraseña:</label>
        <input type="password">

        <input type="submit" value="Enviar">
    </form>
</body>

</html>
