<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="estilo_poke.css">
</head>

<body>

    <header>
        <h1>Pokédex</h1>
    </header>

    <section>

    <div class="contenedor">

        <div class="card">
            <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/001.png">
            <div class="card-content">
                <h2>Bulbasaur</h2>
                <p>Crece alimentándose de los nutrientes del bulbo de su lomo.</p>
                <button>Ver más</button>
            </div>
        </div>

        <div class="card">
            <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/004.png">
            <div class="card-content">
                <h2>Charmander</h2>
                <p>La llama de su cola indica su fuerza vital.</p>
                <button>Ver más</button>
            </div>
        </div>

        <div class="card">
            <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/007.png">
            <div class="card-content">
                <h2>Squirtle</h2>
                <p>Pokémon de agua con un caparazón resistente.</p>
                <button>Ver más</button>
            </div>
        </div>

    </div>
    </section>
    

</body>
</html>
